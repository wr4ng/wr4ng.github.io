{{ define "main" }}
	<div id="reading-progress"><div id="reading-progress-fill"></div></div>
    <h1 class="header">{{ .Title }}</h1>
	<div class="under-header">
		{{ if .Params.github }}
		<a href="{{ .Params.github }}">View on GitHub</a>
		{{ end }}
		<p class="info" >{{ time.Format "2006-01-02" .Date }}, {{ .WordCount }} words, {{ printf "~%d minutes" .ReadingTime }}</p>
	</div>
    <div>
        {{ .Content }}
    </div>
    <p><a href="/">Back to Home</a></p>
{{ end }}
